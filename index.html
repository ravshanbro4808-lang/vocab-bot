 const cnt=[0,0,0,0,0,0,0];d.g.forEach(g=>{if(g.l>=1&&g.l<=6)cnt[g.l]++});
 H(`<div class=gzh><small>${gzCrumb(2)}</small><h2>Darajani tanlang</h2></div><div class=gzlv>${[1,2,3,4,5,6].map(l=>`<div class="gzl g${l} ${cnt[l]?'':'off'}" ${cnt[l]?`onclick="gramLevelPick(${l})"`:''}><i>${GLV[l]}</i><b>${GLVN[l]}</b><small>${cnt[l]?cnt[l]+' ta grammatika':"hali yo'q"}</small></div>`).join('')}</div>
 <div class=gzr onclick="gramLevelPick(0)"><em>📚</em><div><b>Barcha darajalar</b><small>${d.g.length} ta grammatika</small></div><span class=gzn>›</span></div>`)}
function gramLevelPick(l){S.gl=l;S.gcat='';nav(gramCats)}
// 3/4 — bo'lim
async function gramCats(){S.gcat='';head('Grammatika','back()');let d;try{d=await gramLoad()}catch{return}
 const base=d.g.filter(g=>!S.gl||g.l==S.gl),cm=new Map();base.forEach(g=>cm.set(g.c,(cm.get(g.c)||0)+1));const cats=[...cm.keys()];window.GCATS=cats;
 H(`<div class=gzh><small>${gzCrumb(3)}</small><h2>Bo'limni tanlang</h2></div>${gzGames()}
 <div class=gzr onclick="gramCatPick('')"><em>📚</em><div><b>Barcha bo'limlar</b><small>${base.length} ta grammatika</small></div><span class=gzn>›</span></div>
 ${cats.map((c,i)=>`<div class=gzr onclick="gramCatPick(${i})"><em>${GCAT_ICON[c]||'📘'}</em><div><b>${esc(c)}</b><small>${cm.get(c)} ta grammatika</small></div><span class=gzn>›</span></div>`).join('')||`<p class=s>Bu darajada hali grammatika yo'q</p>`}`)}
function gramCatPick(i){S.gcat=i===''?'':GCATS[i];nav(gramHome)}
// 4/4 — grammatikalar ro'yxati
async function gramHome(){head('Grammatika','back()');let d;try{d=await gramLoad()}catch{return}
 const pool=gramPool();
 H(`<div class=gzh><small>${gzCrumb(4)}</small><h2>${S.gcat?esc(S.gcat):"Barcha bo'limlar"}</h2><div class=gzs>${pool.length} ta grammatika</div></div>${gzGames()}
 ${pool.length?`<div class=row><button class=nxt onclick="nav(gramView,${pool[0].id})">🎓 Birma-bir tanishib chiqish (${pool.length} ta)</button></div>`:''}
 ${pool.map(g=>`<div class="gzi g${g.l}" onclick="nav(gramView,${g.id})"><div><b>${esc(g.p)}</b><small>${esc(g.m)}</small></div><div class=gzx><button class=pill onclick="event.stopPropagation();sayGram(${g.id},this)">🔊</button><span class=glv>${GLV[g.l]||''}</span></div></div>`).join('')||'<p class=s>Topilmadi</p>'}`)}
function gxCount(id){try{return +localStorage['gx'+id]||0}catch{return 0}}
function gxBump(id){try{localStorage['gx'+id]=gxCount(id)+2}catch{}}
async function gramView(id){head('Grammatika','back()');let d;try{d=await gramLoad()}catch{return}const g=d.by[id];if(!g)return back();
 const n=g.e.length,c=gxCount(id),ex=n?[g.e[c%n],g.e[(c+1)%n]].filter((x,i,a)=>a.indexOf(x)==i):[];if(n)gxBump(id);
 H(`<div class="gzv g${g.l}"><span class=glv>${GLV[g.l]||''} ${GLVN[g.l]||''} · ${esc(g.c)}</span><h2>${esc(g.p)}</h2><div class=mm>${esc(g.m)}</div><div class=exbt><button class=pill onclick="sayGram(${id},this)">🔊 Grammatikani eshitish</button></div></div>
 <div class=card style="display:block"><b>📍 Qachon va qayerda ishlatiladi?</b><p style="margin:6px 0 0">${esc(g.u)}</p></div>
 <h3 class=sec style="font-size:18px">💬 Misollar</h3><div id=gxl>${ex.length?ex.map(e=>gxRow(e)).join(''):'<p class=s>⏳ Misol gaplar yozilmoqda...</p>'}</div>
 <div class=row><button class=pill onclick="gramView(${id})">🔄 Boshqa misollar</button><button class=pill onclick="gramMore(${id},this)">✨ AI yangi misol</button></div>
 <div class=row><button class=nxt onclick="nav(gramGame,'fill',${id})">✏️ Shu grammatikani mashq qilish</button></div>${gramNavHTML(id)}`);
 if(!n)gramMore(id,null)}
// ---- grammatikani o'qib berish va birma-bir ko'rib chiqish
function gramPoolIds(id){let a=gramPool().map(x=>x.id);if(!a.includes(id))a=S.gr.g.map(x=>x.id);return a}
function gramNavHTML(id){const a=gramPoolIds(id),i=a.indexOf(id),pv=a[(i-1+a.length)%a.length],nx=a[(i+1)%a.length];
  return `<div class=row style="justify-content:space-between;align-items:center"><button class=pill onclick="gramView(${pv})">⬅ Oldingi</button><small>${i+1} / ${a.length}</small><button class=pill onclick="gramView(${nx})">Keyingi ➡</button></div>`}
function gramText(id){const g=S.gr.by[id],d=S.gr,_d=x=>{x=String(x||'').trim();return x&&!/[.!?]$/.test(x)?x+'.':x};
  return [`Grammatika: ${g.p}.`,`Daraja: ${d.lv[g.l]}. Turkum: ${g.c}.`,`Ma'nosi: ${_d(g.m)}`,`Qachon va qayerda ishlatiladi: ${_d(g.u)}`].join(' ')}
async function sayGram(id,b){if(!S.gr||!S.gr.by[id])return;const t=window._sayT=(window._sayT||0)+1;audUnlock();try{speechSynthesis.cancel()}catch{}
  const g=S.gr.by[id],parts=[g.p,g.m,g.u].map(x=>String(x||'').trim()).filter(Boolean);let old='';if(b){old=b.textContent;b.disabled=1;b.textContent='⏳'}
  const urls=await Promise.all(parts.map((p,k)=>srvAudio(p,k==0?(S.gLang||'ko'):'uz')));if(b){b.disabled=0;b.textContent=old}
  for(let k=0;k<parts.length;k++){if(window._sayT!==t)return;await new Promise(res=>{if(urls[k])playSrc('/audio/'+urls[k],res,()=>speak(parts[k],res,k==0?(S.gLang||'ko'):'uz'));else speak(parts[k],res,k==0?(S.gLang||'ko'):'uz')});await new Promise(z=>setTimeout(z,250))}}
function gxRow(e){return `<div class=exr><div class=exk>${hl(e[0])}</div><div class=exu>${esc(e[1])}</div><div class=exbt><button class=pill onclick="sayKoUz(${jq(plainKo(e[0]))},${jq(e[1])},this,${jq(S.gLang||'ko')})">🔊 Eshitish</button></div></div>`}
async function gramMore(id,b){if(b){b.disabled=1;b.textContent='⏳ ...'}const r=await api('/gram/more',{body:{id}}).catch(()=>null);if(b){b.disabled=0;b.textContent='✨ AI yangi misol'}
 const box=$('#gxl');if(!r||!r.ex||!r.ex.length){if(b)alert((r&&r.e)||"Yangi misol topilmadi");else if(box&&S.gr&&S.gr.by[id]&&!S.gr.by[id].e.length)box.innerHTML="<p class=s>Misol topilmadi. «✨ AI yangi misol» tugmasini bosing.</p>";return}
 S.gr.by[id].e.push(...r.ex);if(box)box.innerHTML=r.ex.map(e=>gxRow(e)).join('')}
// ---------- 5 ta o'yin
const GA=a=>a.length;
function gMkQs(mode,only){const pool=only!=null?[S.gr.by[only]]:(gramPool().length>=6?gramPool():S.gr.g),all=S.gr.g,N=only!=null?5:8,qs=[];
 const exs=g=>g.e.filter(e=>/\{.+\}/.test(e[0])),others=(g,f)=>shuf(all.filter(x=>x.id!=g.id&&(!f||f(x))));
 if(mode=='match'){const p=shuf(pool).slice(0,10);for(let i=0;i<p.length;i+=5)if(p.slice(i,i+5).length>=3)qs.push({pairs:p.slice(i,i+5)});return qs}
 const src=only!=null?[S.gr.by[only],S.gr.by[only],S.gr.by[only],S.gr.by[only],S.gr.by[only]]:shuf(pool).slice(0,N);
 let used=0;for(const g of src){const E=exs(g);if(!E.length)continue;
  if(mode=='fill'){const e=E[(used++)%E.length],m=e[0].match(/\{(.+?)\}/),ans=m[1],ko=e[0].replace(/\{.+?\}/,'＿＿＿').replace(/[{}]/g,'');
   const pl=new Set([ans]);const ds=[];for(const o of others(g,x=>x.c==g.c).concat(others(g)))for(const oe of shuf(exs(o))){const t=oe[0].match(/\{(.+?)\}/)[1];if(!pl.has(t)){pl.add(t);ds.push(t);break}if(ds.length>=3)break}
   if(ds.length<3)continue;qs.push({t:'fill',ko,uz:e[1],ans,opts:shuf([ans,...ds.slice(0,3)]),g})}
  else if(mode=='mean'){const ds=[...new Set(others(g,x=>x.c==g.c).concat(others(g)).map(x=>x.m).filter(m=>m!=g.m))].slice(0,3);qs.push({t:'mean',ans:g.m,opts:shuf([g.m,...ds]),g})}
  else if(mode=='which'){const e=E[(used++)%E.length],ds=[...new Set(others(g,x=>x.c==g.c).concat(others(g)).map(x=>x.p).filter(p=>p!=g.p))].slice(0,3);qs.push({t:'which',ko:plainKo(e[0]),uz:e[1],ans:g.p,opts:shuf([g.p,...ds]),g})}
  else if(mode=='build'){const e=E[(used++)%E.length],ko=plainKo(e[0]),L=ko.split(' ');if(L.length<3||L.length>8)continue;qs.push({t:'build',ko,uz:e[1],L,g})}}
 return qs.slice(0,N)}
async function gramGame(mode,only){let d;try{d=await gramLoad()}catch{return}
 const qs=gMkQs(mode,only);if(qs.length<(mode=='match'?1:3)){alert("Bu o'yin uchun ma'lumot yetmadi. Filtrni o'zgartiring.");return back()}
 S.gg={mode,qs,i:0,score:0,wrong:[],lock:0,only};gramQ()}
const GTITLE={fill:"Bo'sh joyni to'ldir",mean:"Ma'nosi nima?",which:'Qaysi grammatika?',build:'Gap tuz',match:'Juftlash'};
function gramQ(){const g=S.gg,q=g.qs[g.i];head(GTITLE[g.mode],'back()');if(!q)return gramEnd();g.lock=0;
 const pb=`<div class=pb><i style="width:${Math.round(g.i/g.qs.length*100)}%"></i></div>`;
 if(g.mode=='match'){g.sel=null;g.done=0;g.R=shuf(q.pairs.map(x=>x.m));return H(pb+mas("Grammatikani uning ma'nosi bilan juftlang!")+`<div class=mgrid><div>${q.pairs.map(p=>`<button class="mc" data-k="p${p.id}" onclick="gMatch(this,'p',${p.id})">${esc(p.p)}</button>`).join('')}</div><div>${g.R.map(m=>{const p=q.pairs.find(x=>x.m==m);return `<button class="mc" data-k="m${p.id}" onclick="gMatch(this,'m',${p.id})">${esc(m)}</button>`}).join('')}</div></div><div id=gfb></div>`)}
 if(g.mode=='build'){g.ans=[];g.tiles=shuf(q.L.map((c,i)=>({c,i})));return gBuildV(pb)}
 const top=g.mode=='fill'?`${mas("Bo'sh joyga mos grammatikani tanlang")}<div class=sticker style="font-size:26px">${esc(q.ko)}<small>${esc(q.uz)}</small></div>`:g.mode=='mean'?`${mas("Bu grammatika qanday ma'no beradi?")}<div class=sticker>${esc(q.g.p)}</div>`:`${mas('Bu gapda qaysi grammatika ishlatilgan?')}<div class=sticker style="font-size:26px">${esc(q.ko)}<small>${esc(q.uz)}</small><button class=pill onclick="speak(${esc(JSON.stringify(q.ko)).replace(/'/g,'&#39;')},null,'${S.gLang||'ko'}')">🔊</button></div>`;
 H(pb+top+q.opts.map((o,i)=>`<button class=opt2 data-o="${i}" onclick="gPick(this,${i})"><span>${'ABCD'[i]}</span>${esc(o)}</button>`).join('')+'<div id=gfb></div>')}
function gFeed(ok,q,extra){const g=S.gg;if(ok)g.score++;else g.wrong.push(q.g||q);
 const p=q.g;$('#gfb').innerHTML=`<div class="${ok?'okb':'nob'}">${ok?'✅ To\'g\'ri!':'❌ Noto\'g\'ri'}</div>${p?`<div class=card style="display:block"><b>${esc(p.p)}</b> — ${esc(p.m)}<br><small>${esc(p.u)}</small>${extra||''}</div>`:''}<button class=nxt onclick="S.gg.i++;gramQ()">Keyingi ➜</button>`;if(ok)confetti(6)}
function gPick(b,i){const g=S.gg,q=g.qs[g.i];if(g.lock)return;g.lock=1;const ok=q.opts[i]==q.ans;b.classList.add(ok?'ok':'no');if(!ok)[...document.querySelectorAll('.opt2')].find(x=>q.opts[+x.dataset.o]==q.ans)?.classList.add('ok');
 gFeed(ok,q,q.t=='fill'?`<br>✔️ ${hl(q.ko.replace('＿＿＿','{'+q.ans+'}'))}`:'')}
function gBuildV(pb){const g=S.gg,q=g.qs[g.i];pb=pb||`<div class=pb><i style="width:${Math.round(g.i/g.qs.length*100)}%"></i></div>`;
 H(pb+mas("Bo'laklarni to'g'ri tartibda terib, gap tuz!")+`<div class=sticker style="font-size:24px">${esc(q.uz)}</div><div class=slots>${q.L.map((_,i)=>`<span class="slot ${g.ans[i]?'f':''}" style="font-size:18px">${g.ans[i]?esc(g.ans[i].c):''}</span>`).join('')}</div><div class=tilesrow>${g.tiles.map((t,i)=>`<button class="tl ${g.ans.includes(t)?'used':''}" style="font-size:18px" onclick="gBuildTap(${i})">${esc(t.c)}</button>`).join('')}</div><div class=row><button class=pill onclick="S.gg.ans=[];gBuildV()">↺ Qaytadan</button></div><div id=gfb></div>`)}
function gBuildTap(ti){const g=S.gg,q=g.qs[g.i],t=g.tiles[ti];if(g.lock||g.ans.includes(t))return;g.ans.push(t);
 if(g.ans.length<q.L.length)return gBuildV();const ok=g.ans.map(x=>x.c).join(' ')==q.L.join(' ');
 if(ok){g.lock=1;gBuildV();speak(q.ko,null,S.gLang||'ko');gFeed(true,q,`<br>✔️ ${esc(q.ko)}`)}else{g.wrong.push(q.g);g.ans=[];gBuildV();document.querySelector('.slots')?.classList.add('shake');g.fails=(g.fails||0)+1;
  if(g.fails>=2){g.fails=0;g.lock=1;S.gg.wrong.pop();g.wrong.push(q.g);$('#gfb').innerHTML=`<div class=nob>❌ To'g'ri javob:</div><div class=card style="display:block"><b>${esc(q.ko)}</b><br><small>${esc(q.g.p)} — ${esc(q.g.m)}</small></div><button class=nxt onclick="S.gg.i++;gramQ()">Keyingi ➜</button>`}}}
function gMatch(b,side,id){const g=S.gg;if(b.classList.contains('dn'))return;
 if(!g.sel){g.sel={b,side,id};b.classList.add('sl');return}
 if(g.sel.b===b){b.classList.remove('sl');g.sel=null;return}
 if(g.sel.side==side){g.sel.b.classList.remove('sl');g.sel={b,side,id};b.classList.add('sl');return}
 const a=g.sel;g.sel=null;a.b.classList.remove('sl');
 if(a.id==id){a.b.classList.add('dn');b.classList.add('dn');g.score++;g.done++;if(g.done>=g.qs[g.i].pairs.length){confetti(8);setTimeout(()=>{g.i++;gramQ()},500)}}
 else{a.b.classList.add('bad');b.classList.add('bad');const p=S.gr.by[a.side=='p'?a.id:id];g.wrong.push(p);setTimeout(()=>{a.b.classList.remove('bad');b.classList.remove('bad')},500)}}
function gramEnd(){const g=S.gg,tot=g.mode=='match'?g.qs.reduce((s,q)=>s+q.pairs.length,0):g.qs.length,pts=Math.min(g.score*2,60);api('/score',{body:{points:pts}}).catch(()=>{});confetti();
 const wr=[...new Map(g.wrong.map(x=>[x.id,x])).values()];
 H(`${mas(g.score>=tot*.8?'Barakalla! 🎉':"Yaxshi urinish! Xatolarni qayta ko'rib chiqing 💪")}<div class=sticker>🏆 ${g.score} / ${tot}<small>+${pts} ball</small></div>${wr.length?`<h3 class=sec style="font-size:18px">Qayta ko'ring</h3>`+wr.map(x=>`<div class=card onclick="nav(gramView,${x.id})"><div><b>${esc(x.p)}</b><br><small>${esc(x.m)}</small></div><i>›</i></div>`).join(''):''}<div class=row><button class=nxt onclick="gramGame('${g.mode}'${g.only!=null?','+g.only:''})">🔁 Qayta o'ynash</button></div><div class=row><button class="b g" onclick="back()">← Grammatika</button></div>`)}

<script>
(function(){const m=document.getElementById('m');if(!m)return;
const rm=()=>document.documentElement.classList.contains('rm')||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
const pop=(el,i)=>{try{el.animate([{opacity:0,transform:'translateY(18px) scale(.96)'},{opacity:1,transform:'none'}],{duration:460,delay:Math.min(i,10)*45,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'})}catch(e){}};
new MutationObserver(ms=>{if(rm())return;let i=0;for(const r of ms)for(const n of r.addedNodes)if(n.nodeType===1&&n.parentNode===m)pop(n,i++);
 m.querySelectorAll('.grid>*:not([data-a])').forEach((n,k)=>{n.dataset.a=1;pop(n,k+2)})}).observe(m,{childList:true});
document.addEventListener('pointerdown',e=>{if(rm())return;const b=e.target.closest&&e.target.closest('.b,.nxt,.big2,.pill,.lrn,.gold,.backpill,.cta button,.send');if(!b)return;
 const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,d=document.createElement('span');
 d.style.cssText='position:absolute;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px;width:'+s+'px;height:'+s+'px;border-radius:50%;background:currentColor;pointer-events:none;opacity:0';
 b.appendChild(d);d.animate([{transform:'scale(0)',opacity:.3},{transform:'scale(1)',opacity:0}],{duration:580,easing:'ease-out'}).onfinish=()=>d.remove()},{passive:true});
})();
